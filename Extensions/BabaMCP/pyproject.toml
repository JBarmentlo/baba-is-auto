[project]
name = "baba-mcp"
version = "0.1.0"
description = "MCP server wrapping the pyBaba Baba Is You simulator"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "pybaba"]

[project.scripts]
baba-mcp = "baba_mcp.server:main"

[tool.uv.sources]
pybaba = { path = "../../", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baba_mcp"]
