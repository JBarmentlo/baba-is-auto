[project]
name = "baba"
version = "0.1.0"
description = "A pure-functional Python Baba Is You rule engine (canonical mechanics)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
